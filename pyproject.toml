[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-guardian"
version = "0.1.0"
description = "Lightweight CLI tool for PostgreSQL schema auditing, integrity-verified backups, and safe synthetic seeding."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Wazz1n" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psycopg[binary]>=3.1.0",
    "faker>=24.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pgg = "pg_guardian.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
